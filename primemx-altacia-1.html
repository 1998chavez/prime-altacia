const sb = async (path, opts = {}) => {
  const res = await fetch(`${SB_URL}/rest/v1${path}`, {
    ...opts,
    headers: {
      apikey: SB_KEY,
      Authorization: `Bearer ${SB_KEY}`,
      "Content-Type": "application/json",

      ...(opts.headers || {}),

};

const nv = v => parseFloat(v)||0;
const fmtM = v => v>=1000?"$"+(v/1000).toFixed(1)+"k":"$"+Math.round(v).toLocaleString();
const fmtPct = v => (v*100).toFixed(0)+"%";

function calcStats(ventas=[], cfg={}) {
  const cuotaTienda  = nv(cfg.cuota_tienda);
  const ventasTienda = nv(cfg.ventas_tienda);
  const mixNuevo     = nv(cfg.mix_nuevo)/100;

  const posV   = ventas.filter(v=>SALE_TYPES.find(s=>s.key===v.tipo)?.countsPOS).length;
  const renovV = ventas.filter(v=>SALE_TYPES.find(s=>s.key===v.tipo)?.countsRENOV).length;
  const segV   = ventas.filter(v=>v.tipo==="seguro").length;
  const accM   = ventas.filter(v=>v.tipo==="accesorio").reduce((s,v)=>s+nv(v.valor),0);
  const nuevoV = ventas.filter(v=>SALE_TYPES.find(s=>s.key===v.tipo)?.tag==="NUEVO").length;
  const propioV= ventas.filter(v=>SALE_TYPES.find(s=>s.key===v.tipo)?.tag==="PROPIO").length;

  const alcPos   = T.pospago>0      ? posV/T.pospago        : 0;
  const alcRenov = T.renovaciones>0 ? renovV/T.renovaciones : 0;
  const alcSeg   = T.seguros>0      ? segV/T.seguros         : 0;
  const alcAcc   = T.accesorios>0   ? accM/T.accesorios      : 0;
  const alcTienda= cuotaTienda>0    ? ventasTienda/cuotaTienda: 0;

  const tiendaOK = alcTienda>=0.80;
  const minPos2  = posV>=2;
  const puedeC   = tiendaOK && minPos2;

  const getBP = (ai,at) => { for(const t of BONO_POS_TIERS)   if(ai>=t.minIndiv&&at>=t.minTienda) return t; return BONO_POS_TIERS[3]; };
  const getBR = (ai,at) => { for(const t of BONO_RENOV_TIERS) if(ai>=t.minIndiv&&at>=t.minTienda) return t; return BONO_RENOV_TIERS[3]; };
  const bpTier = getBP(alcPos,alcTienda);
  const brTier = getBR(alcRenov,alcTienda);
  const bonoPOS   = puedeC ? bpTier.bono : 0;
  const bonoRENOV = puedeC ? brTier.bono : 0;

  const alcTotOK = (alcPos+alcRenov)/2>=1.0;
  const linesAzul3= ventas.filter(v=>v.plan_id&&AZUL3_IDS.includes(v.plan_id)&&(v.tipo==="pos_nuevo"||v.tipo==="renov_nuevo")).length;
  const linesPlata= ventas.filter(v=>v.plan_id&&PLATA_IDS.includes(v.plan_id)&&(v.tipo==="pos_nuevo"||v.tipo==="renov_nuevo")).length;
  const iL100  = puedeC&&alcTotOK&&mixNuevo>=0.55 ? linesAzul3*100 : 0;
  const iLPlata= puedeC&&alcTotOK&&mixNuevo>=0.60 ? linesPlata*200 : 0;

  const comV = ventas.reduce((s,v)=>{
    if (!puedeC) return s;
    if (v.tipo==="accesorio") return s+nv(v.valor)*(v.es_alpha?0.10:0.02);
    if (v.tipo==="seguro")    return s+nv(v.valor)*0.80;
    if (v.tipo==="prepago")   return s+(nv(v.valor)>=150?nv(v.valor)*0.40:0);
    if (v.plan_com)           return s+nv(v.plan_com);
    return s;
  },0);

  const acumulado = comV+bonoPOS+bonoRENOV+iL100+iLPlata;
  return { posV,renovV,segV,accM,nuevoV,propioV,alcPos,alcRenov,alcSeg,alcAcc,alcTienda,tiendaOK,minPos2,puedeC,bonoPOS,bonoRENOV,bpTier,brTier,iL100,iLPlata,comV,acumulado,perdida:acumulado-T.meta_ingreso,mixNuevo };
}

function Login({ onLogin }) {

  const [execs, setExecs]   = useState([]);

  useEffect(()=>{
    sb("/ejecutivos?select=id,nombre&order=nombre").then(setExecs).catch(()=>{});
  },[]);

  async function loginExec() {
    if (!nombre||!pin) return setErr("Selecciona tu nombre e ingresa tu PIN.");
    setLoading(true); setErr("");
    try {
      const res = await sb(`/ejecutivos?nombre=eq.${encodeURIComponent(nombre)}&pin=eq.${pin}&select=*`);
      if (!res||!res.length) { setErr("PIN incorrecto."); setLoading(false); return; }
      onLogin({ type:"exec", exec:res[0] });
    } catch(e) { setErr("Error de conexión."); setLoading(false); }
  }

  async function register() {
    if (!nombre.trim()||pin.length<4) return setErr("Nombre requerido y PIN de mínimo 4 dígitos.");
    setLoading(true); setErr("");
    try {
      const exists = await sb(`/ejecutivos?nombre=eq.${encodeURIComponent(nombre.trim())}&select=id`);
      if (exists&&exists.length) { setErr("Ese nombre ya existe."); setLoading(false); return; }
      const res = await sb("/ejecutivos",{ method:"POST", body:JSON.stringify({nombre:nombre.trim(),pin}) });
      onLogin({ type:"exec", exec:res[0] });
    } catch(e) { setErr("Error al registrar."); setLoading(false); }
  }

function NuevaVenta({ onAdd, accent }) {
  const [tipo,  setTipo]  = useState("pos_nuevo");
  const [planId,setPlanId]= useState("");
  const [valor, setValor] = useState("");
  const [alpha, setAlpha] = useState(false);
  const [dia,   setDia]   = useState(0);
  const [loading,setL]    = useState(false);

  const st     = SALE_TYPES.find(s=>s.key===tipo);
  const planObj= st?.planes?.find(p=>p.id===planId)||null;

  async function add() {
    if (st?.planes&&!planObj) return;
    if (!st?.planes&&!nv(valor)) return;
    setL(true);
    await onAdd({ tipo, plan_id:planObj?.id||null, plan_nombre:planObj?.n||null, plan_renta:planObj?.r||null, plan_com:planObj?.c||null, valor:nv(valor), es_alpha:alpha, dia });
    setPlanId(""); setValor(""); setAlpha(false); setL(false);
  }

  const groups = [
    {label:"📱 Pospago",        keys:["pos_nuevo","pos_propio"]},
    {label:"🔄 Renovaciones",   keys:["renov_nuevo","renov_propio"]},
    {label:"🏢 Ármalo Negocios",keys:["neg_nuevo","neg_propio"]},
    {label:"💡 Plan Lite",      keys:["lite"]},
    {label:"➕ Adicionales",    keys:["accesorio","seguro","prepago"]},
  ];

  return (
    <div style={{ background:"#f8fafc",borderRadius:12,padding:"14px 16px",border:"2px dashed #cbd5e1" }}>
      <div style={{ fontSize:11,fontWeight:800,color:accent,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:10 }}>+ Registrar venta</div>
      <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8 }}>
        <div>
          <label style={S.lbl}>Día</label>
          <select value={dia} onChange={e=>setDia(+e.target.value)} style={S.sel}>
            {DAYS_FULL.map((d,i)=><option key={i} value={i}>{d}</option>)}
          </select>
        </div>
        <div>
          <label style={S.lbl}>Tipo de venta</label>
          <select value={tipo} onChange={e=>{setTipo(e.target.value);setPlanId("");}} style={S.sel}>
            {groups.map(g=>(
              <optgroup key={g.label} label={g.label}>
                {g.keys.map(k=>{const s=SALE_TYPES.find(x=>x.key===k);return <option key={k} value={k}>{s.icon} {s.label}</option>;})}
              </optgroup>
            ))}
          </select>
        </div>
      </div>
      {st?.tag && (
        <div style={{ marginBottom:8 }}>
          <span style={{ fontSize:11,fontWeight:800,padding:"3px 10px",borderRadius:20,...(TAG_COLORS[st.tag]||{bg:"#f1f5f9",color:"#475569"}) }}>
            {st.tag==="NUEVO"?"📦 Equipo Nuevo":st.tag==="PROPIO"?"📲 Equipo Propio / BYOD":st.tag}
          </span>
        </div>
      )}
      {st?.planes && (
        <div style={{ marginBottom:8 }}>
          <label style={S.lbl}>Plan</label>
          <select value={planId} onChange={e=>setPlanId(e.target.value)} style={S.sel}>
            <option value="">— Selecciona plan —</option>
            {st.planes.map(p=><option key={p.id} value={p.id}>{p.n} · ${p.r} renta · ${p.c} comisión</option>)}
          </select>
        </div>
      )}
      {!st?.planes && (
        <div style={{ display:"grid",gridTemplateColumns:tipo==="accesorio"?"1fr 1fr":"1fr",gap:8,marginBottom:8 }}>
          <div>
            <label style={S.lbl}>{tipo==="prepago"?"Monto recarga":"Valor"} ($)</label>
            <input type="number" value={valor} onChange={e=>setValor(e.target.value)} placeholder="0" style={S.inp}/>
          </div>
          {tipo==="accesorio" && (
            <div style={{ display:"flex",flexDirection:"column",justifyContent:"flex-end",paddingBottom:3 }}>
              <label style={{ display:"flex",alignItems:"center",gap:6,fontSize:12,color:"#374151",cursor:"pointer" }}>
                <input type="checkbox" checked={alpha} onChange={e=>setAlpha(e.target.checked)}/> ALPHACOMM (10%)
              </label>
              <div style={{ fontSize:10,color:"#94a3b8" }}>Otras marcas = 2%</div>
            </div>
          )}
        </div>
      )}
      <button onClick={add} disabled={loading} style={{ background:accent,color:"#fff",border:"none",borderRadius:8,padding:"8px 18px",fontWeight:700,fontSize:13,cursor:"pointer",width:"100%",opacity:loading?0.7:1 }}>
        {loading?"Guardando...":"Agregar venta"}
      </button>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
//  EXEC VIEW
// ══════════════════════════════════════════════════════════════
function ExecView({ exec, onLogout }) {
  const [ventas,  setVentas]  = useState([]);
  const [cfg,     setCfg]     = useState({cuota_tienda:"",ventas_tienda:"",mix_nuevo:"65"});
  const [cfgId,   setCfgId]   = useState(null);
  const [ingresoAnt,setIA]    = useState(Object.fromEntries(DAYS_SHORT.map((_,i)=>[i,""])));
  const [tab,     setTab]     = useState("kpis");
  const [semLabel,setSemLabel]= useState("Semana actual");
  const [saving,  setSaving]  = useState(false);
  const [loading, setLoading] = useState(true);

  const cs = PALETTE[0];

  const load = useCallback(async () => {
    setLoading(true);
    try {
      const [v, c] = await Promise.all([
        sb(`/ventas?ejecutivo_id=eq.${exec.id}&order=created_at`),
        sb(`/config_ejecutivo?ejecutivo_id=eq.${exec.id}&limit=1`),
      ]);
      setVentas(v||[]);
      if (c&&c.length) {
        const cx=c[0];
        setCfgId(cx.id);
        setCfg({cuota_tienda:cx.cuota_tienda||"",ventas_tienda:cx.ventas_tienda||"",mix_nuevo:cx.mix_nuevo||"65"});
        setIA(cx.ingreso_ant||Object.fromEntries(DAYS_SHORT.map((_,i)=>[i,""])));
        if (cx.semana_label) setSemLabel(cx.semana_label);
      }
    } catch(e){}
    setLoading(false);
  },[exec.id]);

  useEffect(()=>{ load(); },[load]);

  // Auto-save cfg
  useEffect(()=>{
    if (loading) return;
    const t = setTimeout(async ()=>{
      setSaving(true);
      const payload = { ejecutivo_id:exec.id, cuota_tienda:nv(cfg.cuota_tienda), ventas_tienda:nv(cfg.ventas_tienda), mix_nuevo:nv(cfg.mix_nuevo), ingreso_ant:ingresoAnt, semana_label:semLabel, updated_at:new Date().toISOString() };
      try {
        if (cfgId) { await sb(`/config_ejecutivo?id=eq.${cfgId}`,{method:"PATCH",body:JSON.stringify(payload)}); }
        else { const r=await sb("/config_ejecutivo",{method:"POST",body:JSON.stringify(payload)}); if(r&&r[0]) setCfgId(r[0].id); }
      } catch(e){}
      setSaving(false);
    },800);
    return ()=>clearTimeout(t);
  },[cfg,ingresoAnt,semLabel,loading]);

  async function addVenta(v) {
    const payload = {...v, ejecutivo_id:exec.id, semana_label:semLabel};
    const res = await sb("/ventas",{method:"POST",body:JSON.stringify(payload)});
    if (res&&res[0]) setVentas(p=>[...p,res[0]]);
  }
  async function removeVenta(id) {
    await sb(`/ventas?id=eq.${id}`,{method:"DELETE",prefer:"return=minimal",headers:{Prefer:"return=minimal"}});
    setVentas(p=>p.filter(v=>v.id!==id));
  }

  const s = calcStats(ventas,cfg);

  // Ingreso diario
  const dias = Object.fromEntries(DAYS_SHORT.map((_,i)=>[i,0]));
  ventas.forEach(v=>{ dias[v.dia]=(dias[v.dia]||0)+(s.puedeC?calcVentaCom(v):0); });
  function calcVentaCom(v) {
    if (v.tipo==="accesorio") return nv(v.valor)*(v.es_alpha?0.10:0.02);
    if (v.tipo==="seguro")    return nv(v.valor)*0.80;
    if (v.tipo==="prepago")   return nv(v.valor)>=150?nv(v.valor)*0.40:0;
    if (v.plan_com)           return nv(v.plan_com);
    return 0;
  }
  const totAct = Object.values(dias).reduce((x,v)=>x+v,0);
  const totAnt = DAYS_SHORT.reduce((x,_,i)=>x+nv(ingresoAnt[i]),0);
  const dIng   = totAnt>0?((totAct-totAnt)/totAnt)*100:0;

  const TABS=[{k:"kpis",l:"📊 KPIs & Bonos"},{k:"ventas",l:"💰 Ventas"},{k:"ingresos",l:"📈 Ingresos"}];

  if (loading) return <div style={{ minHeight:"100vh",background:"#f1f5f9",display:"flex",alignItems:"center",justifyContent:"center" }}><div style={{ color:"#64748b",fontSize:14 }}>Cargando tus datos...</div></div>;

  return (
    <div style={{ minHeight:"100vh",background:"#f1f5f9",fontFamily:"'DM Sans','Helvetica Neue',sans-serif",paddingBottom:60 }}>
      {/* Header */}
      <div style={{ background:"#0f172a",padding:"18px 20px",position:"sticky",top:0,zIndex:100,boxShadow:"0 4px 24px rgba(0,0,0,0.25)" }}>
        <div style={{ maxWidth:860,margin:"0 auto",display:"flex",justifyContent:"space-between",alignItems:"center" }}>
          <div>
            <div style={{ fontSize:9,fontWeight:700,letterSpacing:"0.18em",textTransform:"uppercase",color:"#475569" }}>PRIME MX · Sales Tracker</div>
            <div style={{ display:"flex",alignItems:"center",gap:8,marginTop:2 }}>
              <div style={{ fontSize:18,fontWeight:900,color:"#f1f5f9" }}>{exec.nombre}</div>
              <span style={{ fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:20,background:saving?"rgba(245,158,11,0.2)":"rgba(16,185,129,0.2)",color:saving?"#f59e0b":"#10b981" }}>
                {saving?"⏳":"✅"} {saving?"guardando":"guardado"}
              </span>
            </div>
          </div>
          <button onClick={onLogout} style={{ background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:9,color:"#94a3b8",padding:"7px 14px",fontWeight:700,fontSize:12,cursor:"pointer" }}>Salir</button>
        </div>
        {/* Week label */}
        <div style={{ maxWidth:860,margin:"10px auto 0" }}>
          <input value={semLabel} onChange={e=>setSemLabel(e.target.value)} style={{ background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:7,color:"#e2e8f0",padding:"5px 10px",fontSize:12,outline:"none",width:180 }}/>
        </div>
      </div>

      <div style={{ maxWidth:860,margin:"0 auto",padding:"20px 16px 0" }}>
        {/* Card */}
        <div style={{ background:"#fff",borderRadius:20,border:`1.5px solid ${cs.border}`,overflow:"hidden",boxShadow:`0 6px 32px ${cs.accent}18` }}>

          {/* Card header */}
          <div style={{ background:cs.grad,padding:"18px 22px" }}>
            <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center" }}>
              <div>
                <div style={{ fontWeight:900,fontSize:22,color:"#fff" }}>{fmtM(s.acumulado)}</div>
                <div style={{ fontSize:12,color:"rgba(255,255,255,0.75)",marginTop:2 }}>acumulado esta semana</div>
              </div>
              <div style={{ textAlign:"right" }}>
                <div style={{ fontWeight:800,fontSize:14,color:s.perdida>=0?"#34d399":"#f87171" }}>
                  {s.perdida>=0?`✅ +${fmtM(s.perdida)}`:`⚠️ -${fmtM(Math.abs(s.perdida))}`}
                </div>
                <div style={{ fontSize:11,color:"rgba(255,255,255,0.6)" }}>meta {fmtM(T.meta_ingreso)}</div>
              </div>
            </div>
            {/* Mini KPI pills */}
            <div style={{ display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginTop:14 }}>
              {[{l:"POS",v:s.posV,t:T.pospago,a:s.alcPos},{l:"RENOV",v:s.renovV,t:T.renovaciones,a:s.alcRenov},{l:"SEG",v:s.segV,t:T.seguros,a:s.alcSeg},{l:"ACC",v:fmtM(s.accM),t:fmtM(T.accesorios),a:s.alcAcc}].map(k=>(
                <div key={k.l} style={{ background:"rgba(255,255,255,0.12)",borderRadius:10,padding:"8px 6px",textAlign:"center" }}>
                  <div style={{ fontSize:9,fontWeight:700,color:"rgba(255,255,255,0.65)",textTransform:"uppercase" }}>{k.l}</div>
                  <div style={{ fontWeight:900,fontSize:14,color:"#fff",lineHeight:1.1,marginTop:2 }}>{k.v}</div>
                  <div style={{ fontSize:9,color:"rgba(255,255,255,0.5)" }}>/{k.t}</div>
                  <div style={{ height:3,background:"rgba(255,255,255,0.18)",borderRadius:99,marginTop:4 }}>
                    <div style={{ height:"100%",width:`${Math.min(k.a,1)*100}%`,background:k.a>=1?"#34d399":k.a>=0.8?"#fbbf24":"#f87171",borderRadius:99 }}/>
                  </div>
                </div>
              ))}
            </div>
            <div style={{ display:"flex",gap:8,marginTop:10 }}>
              <span style={{ fontSize:11,fontWeight:700,...TAG_COLORS.NUEVO,padding:"2px 10px",borderRadius:20 }}>📦 Nuevo: {s.nuevoV}</span>
              <span style={{ fontSize:11,fontWeight:700,...TAG_COLORS.PROPIO,padding:"2px 10px",borderRadius:20 }}>📲 Propio: {s.propioV}</span>
            </div>
          </div>

          {/* Tabs */}
          <div style={{ display:"flex",borderBottom:"1.5px solid #f1f5f9",background:cs.soft }}>
            {TABS.map(t=><button key={t.k} onClick={()=>setTab(t.k)} style={{ flex:1,padding:"10px 0",border:"none",cursor:"pointer",background:"transparent",fontWeight:700,fontSize:12,color:tab===t.k?cs.accent:"#94a3b8",borderBottom:tab===t.k?`2.5px solid ${cs.accent}`:"2.5px solid transparent",marginBottom:-1.5 }}>{t.l}</button>)}
          </div>

          <div style={{ padding:"20px 22px" }}>

            {/* KPIs */}
            {tab==="kpis" && (
              <div>
                <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:14 }}>
                  <div><label style={S.lbl}>Cuota tienda</label><input type="number" value={cfg.cuota_tienda} onChange={e=>setCfg(p=>({...p,cuota_tienda:e.target.value}))} placeholder="ej. 56" style={S.inp}/></div>
                  <div><label style={S.lbl}>Ventas tienda</label><input type="number" value={cfg.ventas_tienda} onChange={e=>setCfg(p=>({...p,ventas_tienda:e.target.value}))} placeholder="ej. 48" style={S.inp}/></div>
                  <div><label style={S.lbl}>Mix Nuevo (%)</label><input type="number" value={cfg.mix_nuevo} onChange={e=>setCfg(p=>({...p,mix_nuevo:e.target.value}))} placeholder="65" style={S.inp}/></div>
                </div>
                <div style={{ display:"flex",gap:6,flexWrap:"wrap",marginBottom:16 }}>
                  {[{ok:s.tiendaOK,l:s.tiendaOK?`✅ Tienda ${fmtPct(s.alcTienda)}`:"❌ Tienda <80%"},{ok:s.minPos2,l:s.minPos2?`✅ ${s.posV} pospagos`:`⚠️ ${s.posV}/2 mín.`}].map((c,i)=>(
                    <span key={i} style={{ fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:20,background:c.ok?"#d1fae5":"#fee2e2",color:c.ok?"#065f46":"#991b1b" }}>{c.l}</span>
                  ))}
                </div>
                {/* KPI bars */}
                {[{l:"Pospagos",v:s.posV,t:T.pospago,bono:s.bonoPOS,tier:s.bpTier?.label},{l:"Renovaciones",v:s.renovV,t:T.renovaciones,bono:s.bonoRENOV,tier:s.brTier?.label},{l:"Seguros",v:s.segV,t:T.seguros},{l:"Accesorios ($)",v:s.accM,t:T.accesorios,unit:"$"}].map(k=>{
                  const ratio=k.t>0?k.v/k.t:0;
                  const color=ratio>=1?"#10b981":ratio>=0.8?"#f59e0b":"#ef4444";
                  return (
                    <div key={k.l} style={{ marginBottom:13 }}>
                      <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4 }}>
                        <span style={{ fontSize:11,fontWeight:700,color:"#475569" }}>{k.l}</span>
                        <div style={{ display:"flex",alignItems:"center",gap:6 }}>
                          {k.bono!==undefined&&<span style={{ fontSize:10,fontWeight:800,padding:"1px 7px",borderRadius:20,background:ratio>=1?"#d1fae5":"#fef3c7",color:ratio>=1?"#065f46":"#92400e" }}>{ratio>=1?`🔓 ${fmtM(k.bono)}`:`🔒 falta ${k.t-k.v}`}</span>}
                          <span style={{ fontSize:12,fontWeight:800,color }}>{k.unit==="$"?fmtM(k.v):k.v}/{k.unit==="$"?fmtM(k.t):k.t} · {fmtPct(Math.min(ratio,9.99))}</span>
                        </div>
                      </div>
                      <div style={{ height:7,background:"#f1f5f9",borderRadius:99,overflow:"hidden" }}>
                        <div style={{ height:"100%",width:`${Math.min(ratio,1)*100}%`,background:color,borderRadius:99,transition:"width 0.4s" }}/>
                      </div>
                      {k.tier&&<div style={{ fontSize:9,color:"#94a3b8",marginTop:2 }}>{k.tier}</div>}
                    </div>
                  );
                })}
                {/* Bono tiers */}
                <div style={{ marginTop:14,padding:"14px 16px",background:"#f8fafc",borderRadius:12,border:"1px solid #e2e8f0" }}>
                  <div style={{ fontSize:11,fontWeight:800,color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:10 }}>Bonos escalonados</div>
                  <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:10 }}>
                    {[{label:"Bono Pospago",tiers:BONO_POS_TIERS,current:s.bpTier?.label},{label:"Bono Renovaciones",tiers:BONO_RENOV_TIERS,current:s.brTier?.label}].map(b=>(
                      <div key={b.label}>
                        <div style={{ fontSize:11,fontWeight:700,color:"#374151",marginBottom:6 }}>{b.label}</div>
                        {b.tiers.map((t,i)=>(
                          <div key={i} style={{ display:"flex",justifyContent:"space-between",alignItems:"center",padding:"5px 8px",borderRadius:7,marginBottom:3,background:b.current===t.label?"#d1fae5":"#f8fafc",border:b.current===t.label?"1.5px solid #10b981":"1.5px solid #f1f5f9" }}>
                            <span style={{ fontSize:9,color:b.current===t.label?"#065f46":"#94a3b8",lineHeight:1.3 }}>{t.label}</span>
                            <span style={{ fontWeight:800,fontSize:11,color:b.current===t.label?"#10b981":t.bono>0?"#374151":"#cbd5e1" }}>{t.bono>0?fmtM(t.bono):"—"}</span>
                          </div>
                        ))}
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* Ventas */}
            {tab==="ventas" && (
              <div>
                {ventas.length>0 && (
                  <div style={{ marginBottom:16 }}>
                    {DAYS_SHORT.map((day,di)=>{
                      const vd=ventas.filter(v=>v.dia===di);
                      if (!vd.length) return null;
                      return (
                        <div key={di} style={{ marginBottom:10 }}>
                          <div style={{ fontSize:10,fontWeight:800,color:"#94a3b8",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:5 }}>{DAYS_FULL[di]}</div>
                          {vd.map(v=>{
                            const st=SALE_TYPES.find(x=>x.key===v.tipo);
                            const com=s.puedeC?calcVentaCom(v):0;
                            const tagC=st?.tag?(TAG_COLORS[st.tag]||null):null;
                            return (
                              <div key={v.id} style={{ display:"flex",alignItems:"center",gap:10,padding:"8px 12px",background:"#f8fafc",borderRadius:9,marginBottom:4,border:"1px solid #f1f5f9" }}>
                                <div style={{ flex:1,minWidth:0 }}>
                                  <div style={{ display:"flex",alignItems:"center",gap:6,flexWrap:"wrap" }}>
                                    <span style={{ fontSize:12,fontWeight:600,color:"#374151" }}>{st?.icon} {v.plan_nombre||st?.label}{!v.plan_nombre&&v.valor?` $${nv(v.valor).toLocaleString()}`:""}</span>
                                    {tagC&&<span style={{ fontSize:9,fontWeight:800,padding:"1px 6px",borderRadius:20,...tagC }}>{st.tag}</span>}
                                  </div>
                                  {v.plan_renta&&<div style={{ fontSize:10,color:"#94a3b8" }}>${v.plan_renta} renta</div>}
                                </div>
                                <span style={{ fontSize:14,fontWeight:900,color:com>0?cs.accent:"#94a3b8",minWidth:50,textAlign:"right" }}>${Math.round(com).toLocaleString()}</span>
                                <button onClick={()=>removeVenta(v.id)} style={{ background:"none",border:"none",color:"#cbd5e1",cursor:"pointer",fontSize:14,padding:"0 2px",flexShrink:0 }}>✕</button>
                              </div>
                            );
                          })}
                        </div>
                      );
                    })}
                    <div style={{ display:"flex",justifyContent:"space-between",padding:"10px 14px",background:cs.soft,borderRadius:10,border:`1.5px solid ${cs.border}`,marginTop:4,marginBottom:14 }}>
                      <div>
                        <div style={{ fontWeight:700,fontSize:12,color:"#374151" }}>Comisiones {fmtM(s.comV)}</div>
                        {(s.bonoPOS+s.bonoRENOV)>0&&<div style={{ fontSize:11,color:"#10b981",fontWeight:700 }}>+ Bonos {fmtM(s.bonoPOS+s.bonoRENOV)}</div>}
                      </div>
                      <span style={{ fontWeight:900,fontSize:20,color:cs.accent }}>{fmtM(s.acumulado)}</span>
                    </div>
                  </div>
                )}
                <NuevaVenta onAdd={addVenta} accent={cs.accent}/>
              </div>
            )}

            {/* Ingresos */}
            {tab==="ingresos" && (
              <div>
                <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px",background:cs.soft,borderRadius:12,border:`1.5px solid ${cs.border}`,marginBottom:16 }}>
                  <div>
                    <div style={{ fontSize:11,color:"#94a3b8",marginBottom:2 }}>Ingresos semana actual</div>
                    <div style={{ fontSize:26,fontWeight:900,color:cs.accent,letterSpacing:"-0.03em" }}>{fmtM(totAct)}</div>
                    <div style={{ fontSize:11,color:"#94a3b8" }}>vs {fmtM(totAnt)} sem. ant.</div>
                  </div>
                  {(totAct>0||totAnt>0)&&<span style={{ fontSize:11,fontWeight:800,padding:"2px 8px",borderRadius:20,background:dIng>=0?"#d1fae5":"#fee2e2",color:dIng>=0?"#065f46":"#991b1b" }}>{dIng>=0?"▲":"▼"}{Math.abs(dIng).toFixed(1)}%</span>}
                </div>
                {/* bars */}
                {(()=>{
                  const mx=Math.max(...DAYS_SHORT.map((_,i)=>Math.max(dias[i]||0,nv(ingresoAnt[i]))),1);
                  return <div style={{ display:"flex",gap:4,alignItems:"flex-end",height:70,marginBottom:16 }}>{DAYS_SHORT.map((d,i)=>{const c=dias[i]||0,p=nv(ingresoAnt[i]);return(<div key={i} style={{ flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3 }}><div style={{ width:"100%",display:"flex",gap:1,alignItems:"flex-end",height:58 }}><div style={{ flex:1,borderRadius:"3px 3px 0 0",background:"#e2e8f0",height:`${p>0?(p/mx)*100:1}%`,alignSelf:"flex-end" }}/><div style={{ flex:1,borderRadius:"3px 3px 0 0",background:cs.accent,opacity:0.85,height:`${c>0?(c/mx)*100:1}%`,alignSelf:"flex-end" }}/></div><span style={{ fontSize:9,color:"#94a3b8",fontWeight:700 }}>{d}</span></div>);})}</div>;
                })()}
                <div style={{ display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr",gap:6,marginBottom:6 }}>
                  {["Día","Ant. $","Actual $","Δ"].map(h=><span key={h} style={{...S.lbl,margin:0}}>{h}</span>)}
                </div>
                {DAYS_SHORT.map((_,i)=>{
                  const c=dias[i]||0,p=nv(ingresoAnt[i]);
                  const d=p>0?((c-p)/p)*100:0;
                  return (
                    <div key={i} style={{ display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr",gap:6,alignItems:"center",marginBottom:6 }}>
                      <span style={{ fontSize:12,fontWeight:600,color:"#374151" }}>{DAYS_FULL[i]}</span>
                      <input type="number" value={ingresoAnt[i]||""} onChange={e=>setIA(p=>({...p,[i]:e.target.value}))} placeholder="0" style={{...S.inp,textAlign:"right",padding:"6px 8px",fontSize:12}}/>
                      <div style={{ textAlign:"right",fontWeight:700,fontSize:13,color:c>0?cs.accent:"#94a3b8" }}>${Math.round(c).toLocaleString()}</div>
                      <div style={{ textAlign:"right" }}>{(c>0||p>0)?<span style={{ fontSize:10,fontWeight:800,padding:"1px 5px",borderRadius:20,background:d>=0?"#d1fae5":"#fee2e2",color:d>=0?"#065f46":"#991b1b" }}>{d>=0?"▲":"▼"}{Math.abs(d).toFixed(0)}%</span>:<span style={{ fontSize:10,color:"#e2e8f0" }}>—</span>}</div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
//  ADMIN VIEW
// ══════════════════════════════════════════════════════════════
function AdminView({ onLogout }) {
  const [rows,    setRows]    = useState([]);
  const [loading, setLoading] = useState(true);
  const [lastRef, setLastRef] = useState(null);

  const load = useCallback(async () => {
    try {
      const [execs, ventas, cfgs] = await Promise.all([
        sb("/ejecutivos?select=*&order=nombre"),
        sb("/ventas?select=*&order=created_at"),
        sb("/config_ejecutivo?select=*"),
      ]);
      const built = (execs||[]).map((exec,idx)=>{
        const ev  = (ventas||[]).filter(v=>v.ejecutivo_id===exec.id);
        const cfg = (cfgs||[]).find(c=>c.ejecutivo_id===exec.id)||{};
        const s   = calcStats(ev,cfg);
        return { exec, ev, cfg, s, cs:PALETTE[idx%PALETTE.length] };
      }).sort((a,b)=>b.s.acumulado-a.s.acumulado);
      setRows(built);
      setLastRef(new Date().toLocaleTimeString("es-MX"));
    } catch(e){}
    setLoading(false);
  },[]);

  useEffect(()=>{ load(); const iv=setInterval(load,30000); return ()=>clearInterval(iv); },[load]);

  const totAcum  = rows.reduce((x,r)=>x+r.s.acumulado,0);
  const totMeta  = rows.length*T.meta_ingreso;
  const totBonos = rows.reduce((x,r)=>x+r.s.bonoPOS+r.s.bonoRENOV,0);
  const totPos   = rows.reduce((x,r)=>x+r.s.posV,0);

  function calcVentaCom(v, puedeC) {
    if (!puedeC) return 0;
    if (v.tipo==="accesorio") return nv(v.valor)*(v.es_alpha?0.10:0.02);
    if (v.tipo==="seguro")    return nv(v.valor)*0.80;
    if (v.tipo==="prepago")   return nv(v.valor)>=150?nv(v.valor)*0.40:0;
    if (v.plan_com)           return nv(v.plan_com);
    return 0;
  }

  if (loading) return <div style={{ minHeight:"100vh",background:"#f1f5f9",display:"flex",alignItems:"center",justifyContent:"center" }}><div style={{ color:"#64748b" }}>Cargando equipo...</div></div>;

  return (
    <div style={{ minHeight:"100vh",background:"#f1f5f9",fontFamily:"'DM Sans','Helvetica Neue',sans-serif",paddingBottom:60 }}>
      {/* Header */}
      <div style={{ background:"#0f172a",padding:"18px 20px",position:"sticky",top:0,zIndex:100,boxShadow:"0 4px 24px rgba(0,0,0,0.25)" }}>
        <div style={{ maxWidth:900,margin:"0 auto",display:"flex",justifyContent:"space-between",alignItems:"center" }}>
          <div>
            <div style={{ fontSize:9,fontWeight:700,letterSpacing:"0.18em",textTransform:"uppercase",color:"#475569" }}>PRIME MX · Admin</div>
            <div style={{ fontSize:18,fontWeight:900,color:"#f1f5f9" }}>Dashboard del Equipo</div>
            {lastRef&&<div style={{ fontSize:10,color:"#475569",marginTop:1 }}>Actualizado {lastRef} · auto-refresh 30s</div>}
          </div>
          <div style={{ display:"flex",gap:8 }}>
            <button onClick={load} style={{ background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:9,color:"#94a3b8",padding:"7px 14px",fontWeight:700,fontSize:12,cursor:"pointer" }}>🔄 Refresh</button>
            <button onClick={onLogout} style={{ background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:9,color:"#94a3b8",padding:"7px 14px",fontWeight:700,fontSize:12,cursor:"pointer" }}>Salir</button>
          </div>
        </div>
      </div>

      <div style={{ maxWidth:900,margin:"0 auto",padding:"24px 16px 0" }}>
        {/* Team KPIs */}
        <div style={{ display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:12,marginBottom:22 }}>
          {[
            ["💸","Acumulado equipo",fmtM(totAcum),"#1a6fa8"],
            ["🎯","Meta total equipo",fmtM(totMeta),totAcum>=totMeta?"#10b981":"#ef4444"],
            ["🔓","Bonos desbloqueados",fmtM(totBonos),"#10b981"],
            ["📱","Pospagos totales",totPos,"#f97316"],
          ].map(([ic,lb,v,c])=>(
            <div key={lb} style={{ background:"#fff",borderRadius:14,padding:"16px",border:"1.5px solid #f1f5f9",boxShadow:"0 2px 12px rgba(0,0,0,0.04)" }}>
              <div style={{ fontSize:22 }}>{ic}</div>
              <div style={{ fontWeight:900,fontSize:22,color:c,letterSpacing:"-0.03em" }}>{v}</div>
              <div style={{ fontSize:11,color:"#94a3b8" }}>{lb}</div>
            </div>
          ))}
        </div>

        {/* Team progress bar */}
        <div style={{ background:"#fff",borderRadius:14,padding:"16px 20px",border:"1.5px solid #f1f5f9",boxShadow:"0 2px 12px rgba(0,0,0,0.04)",marginBottom:20 }}>
          <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8 }}>
            <span style={{ fontSize:13,fontWeight:700,color:"#374151" }}>Avance equipo vs meta</span>
            <span style={{ fontSize:13,fontWeight:800,color:totAcum>=totMeta?"#10b981":"#f59e0b" }}>{fmtPct(Math.min(totMeta>0?totAcum/totMeta:0,1))}</span>
          </div>
          <div style={{ height:10,background:"#f1f5f9",borderRadius:99,overflow:"hidden" }}>
            <div style={{ height:"100%",width:`${Math.min(totMeta>0?totAcum/totMeta:0,1)*100}%`,background:totAcum>=totMeta?"#10b981":"linear-gradient(90deg,#f59e0b,#f97316)",borderRadius:99,transition:"width 0.5s" }}/>
          </div>
        </div>

        {/* Ranking */}
        <div style={{ background:"#fff",borderRadius:16,border:"1.5px solid #e2e8f0",overflow:"hidden",boxShadow:"0 2px 16px rgba(0,0,0,0.05)",marginBottom:20 }}>
          <div style={{ padding:"14px 20px",borderBottom:"1px solid #f1f5f9",fontWeight:800,fontSize:14,color:"#1e293b" }}>🏆 Ranking en tiempo real</div>
          {rows.map(({exec,s,cs,ev,cfg},rank)=>{
            const perdida=s.acumulado-T.meta_ingreso;
            const dias=Object.fromEntries(DAYS_SHORT.map((_,i)=>[i,0]));
            ev.forEach(v=>{ dias[v.dia]=(dias[v.dia]||0)+calcVentaCom(v,s.puedeC); });
            return (
              <div key={exec.id} style={{ padding:"14px 20px",borderBottom:"1px solid #f8fafc" }}>
                <div style={{ display:"flex",alignItems:"center",gap:12 }}>
                  <div style={{ width:28,height:28,borderRadius:"50%",background:rank===0?"#f59e0b":rank===1?"#9ca3af":rank===2?"#d97706":"#f1f5f9",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:800,color:rank<3?"#fff":"#9ca3af",flexShrink:0 }}>{rank+1}</div>
                  <div style={{ flex:1,minWidth:0 }}>
                    <div style={{ fontWeight:700,fontSize:14,color:"#1e293b" }}>{exec.nombre}</div>
                    <div style={{ fontSize:11,color:"#94a3b8",marginTop:1 }}>
                      📱{s.posV} 🔄{s.renovV} 🛡️{s.segV} · 📦{s.nuevoV} nuevo / 📲{s.propioV} propio
                    </div>
                    {/* Bono pills */}
                    <div style={{ display:"flex",gap:5,marginTop:4,flexWrap:"wrap" }}>
                      {s.bonoPOS>0&&<span style={{ fontSize:10,fontWeight:800,background:"#d1fae5",color:"#065f46",padding:"1px 7px",borderRadius:20 }}>🔓 POS {fmtM(s.bonoPOS)}</span>}
                      {s.bonoRENOV>0&&<span style={{ fontSize:10,fontWeight:800,background:"#d1fae5",color:"#065f46",padding:"1px 7px",borderRadius:20 }}>🔓 RENOV {fmtM(s.bonoRENOV)}</span>}
                      {!s.tiendaOK&&<span style={{ fontSize:10,fontWeight:800,background:"#fee2e2",color:"#991b1b",padding:"1px 7px",borderRadius:20 }}>❌ Sin comisiones</span>}
                      {!s.minPos2&&<span style={{ fontSize:10,fontWeight:800,background:"#fef3c7",color:"#92400e",padding:"1px 7px",borderRadius:20 }}>⚠️ Falta min. pospago</span>}
                    </div>
                  </div>
                  <div style={{ textAlign:"right",flexShrink:0 }}>
                    <div style={{ fontWeight:900,fontSize:18,color:cs.accent }}>{fmtM(s.acumulado)}</div>
                    <div style={{ fontSize:12,fontWeight:800,color:perdida>=0?"#10b981":"#ef4444" }}>
                      {perdida>=0?`✅ +${fmtM(perdida)}`:`⚠️ -${fmtM(Math.abs(perdida))}`}
                    </div>
                  </div>
                </div>
                {/* Mini progress bars */}
                <div style={{ display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginTop:10 }}>
                  {[{l:"POS",v:s.posV,t:T.pospago},{l:"RENOV",v:s.renovV,t:T.renovaciones},{l:"SEG",v:s.segV,t:T.seguros},{l:"ACC",v:s.accM,t:T.accesorios,dollar:true}].map(k=>{
                    const r=k.t>0?k.v/k.t:0;
                    return (
                      <div key={k.l}>
                        <div style={{ display:"flex",justifyContent:"space-between",marginBottom:2 }}>
                          <span style={{ fontSize:9,color:"#94a3b8",fontWeight:700 }}>{k.l}</span>
                          <span style={{ fontSize:9,color:r>=1?"#10b981":r>=0.8?"#f59e0b":"#ef4444",fontWeight:800 }}>{k.dollar?fmtM(k.v):k.v}/{k.dollar?fmtM(k.t):k.t}</span>
                        </div>
                        <div style={{ height:4,background:"#f1f5f9",borderRadius:99,overflow:"hidden" }}>
                          <div style={{ height:"100%",width:`${Math.min(r,1)*100}%`,background:r>=1?"#10b981":r>=0.8?"#f59e0b":"#ef4444",borderRadius:99 }}/>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
//  APP ROOT
// ══════════════════════════════════════════════════════════════
function App() {
  const [session, setSession] = useState(null);

  if (!session) return <Login onLogin={setSession}/>;
  if (session.type==="admin") return <AdminView onLogout={()=>setSession(null)}/>;
  return <ExecView exec={session.exec} onLogout={()=>setSession(null)}/>;
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
